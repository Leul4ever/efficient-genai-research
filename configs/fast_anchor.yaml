# The full-data ceiling. One seed only -- this run is ~10-20x a 5% run and would
# otherwise eat the night. Run it LAST: the paper survives without it, but not
# without the grid.
#
# Inherits configs/base.yaml; values below are the deliberate overrides.

target_model: Qwen/Qwen2.5-0.5B
lora_r: 16
lora_alpha: 32
lora_dropout: 0.05
lora_targets:
- q_proj
- k_proj
- v_proj
- o_proj
- gate_proj
- up_proj
- down_proj
learning_rate: 0.0002
epochs: 3
batch_size: 4
grad_accum: 4
max_seq_len: 512
warmup_ratio: 0.03
weight_decay: 0.0
max_grad_norm: 1.0
eval_batch_size: 8
harness_tasks:
- arc_easy
harness_limit: 300
n_judge_prompts: 0
gen_max_new_tokens: 256
study: fast_grid
grid:
  selection_method:
  - full
  ratio:
  - 1.0
  seed:
  - 0
