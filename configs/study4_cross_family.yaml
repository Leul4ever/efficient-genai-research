# Study 4 -- RQ3, cross-family replication on Llama-3.2-1B.
# EXPLORATORY, and must be labelled as such in the paper: 3 methods x 2 seeds at
# one ratio will not reach significance, and claiming otherwise is the mistake
# this paper exists to criticise. Report effect sizes with CIs and say plainly
# that the design is underpowered for a significance claim.
# Drop this study first if the Kaggle quota bites.
#
# Inherits configs/base.yaml; values below are the deliberate overrides.

target_model: meta-llama/Llama-3.2-1B
lora_r: 16
lora_alpha: 32
load_in_4bit: false   # fp16 LoRA; see train.build_model
lora_dropout: 0.05
lora_targets:
- q_proj
- k_proj
- v_proj
- o_proj
- gate_proj
- up_proj
- down_proj
learning_rate: 0.0002
epochs: 3
batch_size: 4
grad_accum: 4
max_seq_len: 512
warmup_ratio: 0.03
weight_decay: 0.0
max_grad_norm: 1.0
eval_batch_size: 8
harness_tasks:
- ifeval
- arc_easy
- hellaswag
harness_limit: null
n_judge_prompts: 0
gen_max_new_tokens: 256
study: study4_cross_family
grid:
  selection_method:
  - random
  - perplexity
  - ifd
  ratio:
  - 0.05
  seed:
  - 0
  - 1
