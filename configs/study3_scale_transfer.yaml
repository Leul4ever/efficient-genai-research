# Study 3 -- RQ3, scale transfer within the Qwen family.
# Selections are REUSED from Study 1: the same artifact files, unchanged.
# That is the point -- a proxy scores once, then curates for every target.
# Re-running selection per target would measure a different method entirely.
#
# Inherits configs/base.yaml; values below are the deliberate overrides.

target_model: Qwen/Qwen2.5-1.5B
lora_r: 16
lora_alpha: 32
lora_dropout: 0.05
lora_targets:
- q_proj
- k_proj
- v_proj
- o_proj
- gate_proj
- up_proj
- down_proj
learning_rate: 0.0002
epochs: 3
batch_size: 4
grad_accum: 4
max_seq_len: 512
warmup_ratio: 0.03
weight_decay: 0.0
max_grad_norm: 1.0
eval_batch_size: 8
harness_tasks:
- ifeval
- arc_easy
- hellaswag
harness_limit: null
n_judge_prompts: 0
gen_max_new_tokens: 256
study: study3_scale_transfer
grid:
  selection_method:
  - random
  - perplexity
  - ifd
  - learning_percentage
  ratio:
  - 0.05
  - 0.1
  seed:
  - 0
  - 1
